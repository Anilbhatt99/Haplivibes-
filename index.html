<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>PartyMaker - Event Planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>
    <section class="main-wrap">
        <div class="overlay">
            <header>
                <nav>
                    <div class="logo"><img src="Images/Haplivibes!.webp" alt="Haplivibes"></div>

                        <li><a href="#home">Home</a></li>
                        <li><a href="#services">Services</a></li>
